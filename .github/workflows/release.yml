name: Release

# LƯU Ý: mỗi lần phát hành phải TĂNG version trong package.json trước.
# Chạy lại cùng một version sẽ khiến electron-builder gặp asset trùng tên trong release đã có
# và treo ở bước upload (đã gặp thật, phải huỷ job giữa chừng). Version mới thì tạo release mới,
# không có xung đột.
on:
  push:
    tags: ['v*']
  # Cho phép dựng lại mà không cần đẩy tag mới, hữu ích khi chỉ sửa cấu hình đóng gói.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: macos-latest
            script: package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Sidecar không nằm trong repo (binary lớn); tải đúng bản cho từng OS khi build.
      - name: Fetch FFmpeg sidecar
        shell: bash
        run: node scripts/fetch-ffmpeg.mjs

      # `--` để npm chuyển cờ xuống electron-builder ở cuối chuỗi lệnh; tránh cú pháp shell
      # riêng của từng hệ điều hành vì job này chạy cả trên cmd.exe lẫn bash.
      - run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # KHÔNG khai CSC_LINK khi chưa có chứng thư. GitHub Actions luôn đặt biến kể cả khi
          # secret rỗng, và electron-builder hiểu chuỗi rỗng là "có đường dẫn chứng thư" rồi đi
          # tìm file ngay tại thư mục gốc -> "not a file" và hỏng cả job macOS.
          # Khi nào có chứng thư thì thêm lại CSC_LINK, CSC_KEY_PASSWORD, APPLE_* ở đây.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # always(): bước publish hỏng thì vẫn phải lấy được file cài, đừng mất cả lượt build.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/*.*
          if-no-files-found: error

  # Chỉ mở release ra cho trình cập nhật thấy khi đã đủ file của MỌI nền tảng. Không có bước này
  # thì máy nào xong trước sẽ công bố một bản phát hành còn dở dang.
  publish:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
            const tag = `v${version}`
            const { owner, repo } = context.repo

            const list = await github.rest.repos.listReleases({ owner, repo, per_page: 100 })
            const target = list.data.find((r) => r.tag_name === tag)
            if (!target) throw new Error(`Không tìm thấy release ${tag}`)

            const names = target.assets.map((a) => a.name)
            // Kiểm đúng thứ trình cập nhật cần, thay vì tin vào việc job build đã xanh.
            const required = {
              'manifest Windows (latest.yml)': names.includes('latest.yml'),
              'bản cài Windows (.exe)': names.some((n) => n.endsWith('.exe')),
              'manifest macOS (latest-mac.yml)': names.includes('latest-mac.yml'),
            }
            const missing = Object.entries(required).filter(([, ok]) => !ok).map(([k]) => k)
            if (missing.length > 0) {
              throw new Error(
                `${tag} thiếu: ${missing.join(', ')}. Giữ nguyên trạng thái nháp để trình cập nhật ` +
                  'không thấy một bản phát hành dở dang.',
              )
            }

            if (!target.draft) {
              core.info(`${tag} đã ở trạng thái phát hành.`)
              return
            }
            await github.rest.repos.updateRelease({ owner, repo, release_id: target.id, draft: false })
            core.info(`Đã phát hành ${tag} với ${names.length} file.`)
