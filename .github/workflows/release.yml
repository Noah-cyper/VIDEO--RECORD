name: Release

on:
  push:
    tags: ['v*']
  # Cho phép dựng lại mà không cần đẩy tag mới, hữu ích khi chỉ sửa cấu hình đóng gói.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
          - os: macos-latest
            script: package:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Sidecar không nằm trong repo (binary lớn); tải đúng bản cho từng OS khi build.
      - name: Fetch FFmpeg sidecar
        shell: bash
        run: node scripts/fetch-ffmpeg.mjs

      # `--` để npm chuyển cờ xuống electron-builder ở cuối chuỗi lệnh; tránh cú pháp shell
      # riêng của từng hệ điều hành vì job này chạy cả trên cmd.exe lẫn bash.
      - run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # KHÔNG khai CSC_LINK khi chưa có chứng thư. GitHub Actions luôn đặt biến kể cả khi
          # secret rỗng, và electron-builder hiểu chuỗi rỗng là "có đường dẫn chứng thư" rồi đi
          # tìm file ngay tại thư mục gốc -> "not a file" và hỏng cả job macOS.
          # Khi nào có chứng thư thì thêm lại CSC_LINK, CSC_KEY_PASSWORD, APPLE_* ở đây.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # always(): bước publish hỏng thì vẫn phải lấy được file cài, đừng mất cả lượt build.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: release/*.*
          if-no-files-found: error
