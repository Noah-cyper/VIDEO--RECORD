appId: com.noahcyper.callrec
productName: CallRec
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  # Sidecar FFmpeg đi kèm app; thiếu file này thì bước xuất file sẽ báo FfmpegMissingError.
  - from: resources/ffmpeg
    to: ffmpeg
    filter: ['**/*']
  # Sidecar whisper.cpp cho tính năng gỡ băng; thiếu thì nút gỡ băng bị vô hiệu hoá.
  - from: resources/whisper
    to: whisper
    filter: ['**/*']
win:
  # zip là đường lui khi SmartScreen chặn installer chưa ký: giải nén là chạy được ngay.
  target:
    - nsis
    - zip
  icon: build/icon.png
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Cài cho từng người dùng nên không cần quyền quản trị, đỡ một lớp cảnh báo nữa.
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: CallRec
mac:
  icon: build/icon.png
  target: dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Bật notarize khi đã có APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID trong môi trường.
  # Để false thì build vẫn chạy được trên máy không có chứng thư.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: CallRec cần microphone để ghi lại giọng của bạn trong cuộc gọi.
    NSCameraUsageDescription: CallRec cần camera nếu bạn bật ghi webcam.
linux:
  icon: build/icon.png
  target: AppImage
  category: AudioVideo
publish:
  provider: github
  owner: Noah-cyper
  repo: VIDEO--RECORD
  # Draft trong lúc dựng, rồi job "publish" mới chuyển sang phát hành khi ĐỦ file của mọi nền
  # tảng. Để release ở trạng thái phát hành ngay từ job đầu tiên thì máy nào xong trước sẽ mở
  # release ra cho trình cập nhật thấy, trong khi file của nền tảng kia còn đang tải lên -
  # người dùng Windows bấm kiểm tra đúng lúc đó sẽ nhận "đang dùng bản mới nhất" dù không phải.
  releaseType: draft
