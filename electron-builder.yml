appId: com.noahcyper.callrec
productName: CallRec
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  # Sidecar FFmpeg đi kèm app; thiếu file này thì bước xuất file sẽ báo FfmpegMissingError.
  - from: resources/ffmpeg
    to: ffmpeg
    filter: ['**/*']
  # Sidecar whisper.cpp cho tính năng gỡ băng; thiếu thì nút gỡ băng bị vô hiệu hoá.
  - from: resources/whisper
    to: whisper
    filter: ['**/*']
win:
  # zip là đường lui khi SmartScreen chặn installer chưa ký: giải nén là chạy được ngay.
  target:
    - nsis
    - zip
  icon: build/icon.png
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Cài cho từng người dùng nên không cần quyền quản trị, đỡ một lớp cảnh báo nữa.
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: CallRec
mac:
  icon: build/icon.png
  target: dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Bật notarize khi đã có APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID trong môi trường.
  # Để false thì build vẫn chạy được trên máy không có chứng thư.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: CallRec cần microphone để ghi lại giọng của bạn trong cuộc gọi.
    NSCameraUsageDescription: CallRec cần camera nếu bạn bật ghi webcam.
linux:
  icon: build/icon.png
  target: AppImage
  category: AudioVideo
publish:
  provider: github
  owner: Noah-cyper
  repo: VIDEO--RECORD
  # electron-updater chỉ thấy release đã phát hành, không thấy draft. Muốn app tự cập nhật thì
  # bản phát hành phải ở trạng thái release.
  releaseType: release
